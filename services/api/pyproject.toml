[project]
name = "wasel-api"
version = "0.1.0"
description = "Wasel AI route planner: FastAPI + Strands Agents + DeepSeek"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.4",
    "edge-tts>=7.3.1",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "strands-agents[openai]>=1.20,<2",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
